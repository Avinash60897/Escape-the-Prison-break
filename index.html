<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Taxi Rush — Master Edition</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;padding:14px;
    display:flex;flex-direction:column;gap:10px;transition:opacity .3s ease;z-index:5;}
  #hud.dim{opacity:0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .chip{background:rgba(8,12,20,.72);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:8px 14px;color:#fff;font-weight:800;font-size:14px;
    letter-spacing:.7px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:8px;white-space:nowrap;
    box-shadow:0 8px 22px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);}
  #cash{color:#ffd83d;font-size:17px;letter-spacing:1px;}
  #lvl{color:#9fd8ff;font-size:12px;}
  .hearts{display:flex;gap:3px;}
  .heart{font-size:18px;color:#ff4d6d;filter:drop-shadow(0 0 7px rgba(255,77,109,.85));
    transition:color .2s, filter .2s, transform .2s;}
  .heart.off{color:#2a3040;filter:none;transform:scale(.85);}
  #objective{align-self:center;margin-top:2px;background:rgba(8,12,20,.66);
    border:1px solid rgba(120,255,180,.35);border-radius:12px;padding:7px 18px;
    color:#7dffb0;font-weight:800;font-size:13px;letter-spacing:1.6px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 0 24px rgba(70,255,150,.16);
    transition:color .25s, border-color .25s, box-shadow .25s;}
  #objective.drop{color:#8fd8ff;border-color:rgba(140,215,255,.4);
    box-shadow:0 0 24px rgba(90,190,255,.2);}
  #objective.warn{color:#ff7a7a;border-color:rgba(255,120,120,.4);
    box-shadow:0 0 24px rgba(255,90,90,.2);}

  /* ---------- OVERLAY ---------- */
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    padding:16px;z-index:20;
    background:radial-gradient(circle at 50% 38%, rgba(20,28,44,.78), rgba(2,4,8,.96));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  #overlay.show{display:flex;animation:fadeIn .28s ease both;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{from{opacity:0;transform:scale(.92) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}

  .panel{width:100%;max-width:460px;text-align:center;
    background:linear-gradient(165deg,#1a2334 0%,#0b0f17 100%);
    border:1px solid rgba(120,200,255,.18);border-radius:26px;padding:28px 22px 24px;
    box-shadow:0 28px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08);
    animation:popIn .35s cubic-bezier(.2,1.2,.4,1) both;
    max-height:96vh;overflow-y:auto;scrollbar-width:thin;
    scrollbar-color:rgba(120,200,255,.35) transparent;}
  .panel::-webkit-scrollbar{width:5px;}
  .panel::-webkit-scrollbar-thumb{background:rgba(120,200,255,.35);border-radius:3px;}
  .panel.wide{max-width:600px;}
  .logo{font-size:52px;line-height:1;margin-bottom:2px;
    animation:floaty 2.6s ease-in-out infinite;
    filter:drop-shadow(0 10px 20px rgba(255,200,50,.45));}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-9px) rotate(3deg);}}
  .panel h1{font-size:34px;font-weight:900;letter-spacing:3px;color:#fff;
    text-shadow:0 0 22px rgba(120,200,255,.5);margin-bottom:4px;}
  .panel h1 span{color:#ffd83d;text-shadow:0 0 24px rgba(255,216,61,.65);}
  .panel h2{font-size:24px;font-weight:900;letter-spacing:2px;color:#7dffb0;
    text-shadow:0 0 20px rgba(125,255,176,.5);margin-bottom:8px;}
  .panel h2.danger{color:#ff5f6d;text-shadow:0 0 22px rgba(255,95,109,.6);}
  .panel h2.win{color:#ffd83d;text-shadow:0 0 24px rgba(255,216,61,.65);}
  .sub{color:#8b97ad;font-size:12.5px;letter-spacing:1.1px;margin-bottom:16px;font-weight:600;}
  .big{font-size:40px;font-weight:900;color:#ffd83d;letter-spacing:2px;
    text-shadow:0 0 26px rgba(255,216,61,.55);margin:6px 0 2px;}
  .small{color:#8b97ad;font-size:12.5px;font-weight:600;letter-spacing:1px;margin-bottom:4px;}
  .stars{font-size:34px;letter-spacing:6px;margin:8px 0 2px;color:#ffd83d;
    text-shadow:0 0 22px rgba(255,216,61,.7);}
  .stars .off{color:#333b4d;text-shadow:none;}
  .stars span{display:inline-block;animation:starPop .45s cubic-bezier(.2,1.6,.4,1) both;}
  .stars span:nth-child(2){animation-delay:.12s;}
  .stars span:nth-child(3){animation-delay:.24s;}
  @keyframes starPop{from{opacity:0;transform:scale(.2) rotate(-40deg);}to{opacity:1;transform:scale(1) rotate(0);}}

  .btn{margin-top:16px;display:inline-block;padding:15px 38px;border:none;border-radius:16px;
    font-family:inherit;font-size:15px;font-weight:900;letter-spacing:2.2px;color:#04141a;
    cursor:pointer;position:relative;background:linear-gradient(180deg,#66f7cb,#10c9a1);
    box-shadow:0 0 0 1px rgba(102,247,203,.65), 0 10px 30px rgba(16,201,161,.5),
               inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .13s cubic-bezier(.2,1.4,.4,1), box-shadow .13s;}
  .btn:hover{transform:translateY(-2px) scale(1.035);
    box-shadow:0 0 0 1px rgba(102,247,203,.95), 0 14px 38px rgba(16,201,161,.7),
               inset 0 1px 0 rgba(255,255,255,.7);}
  .btn:active{transform:translateY(1px) scale(.975);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn.retry{color:#1a0505;background:linear-gradient(180deg,#ff9a6a,#ff4d4d);
    box-shadow:0 0 0 1px rgba(255,150,110,.7), 0 10px 30px rgba(255,77,77,.5),
               inset 0 1px 0 rgba(255,255,255,.5);}
  .btn.retry:hover{box-shadow:0 0 0 1px rgba(255,150,110,1), 0 14px 38px rgba(255,77,77,.72),
               inset 0 1px 0 rgba(255,255,255,.65);}
  .btn.ghost{background:rgba(255,255,255,.06);color:#cfe4ff;
    box-shadow:0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.06);
    padding:12px 26px;font-size:13px;letter-spacing:1.6px;}
  .btn.ghost:hover{background:rgba(255,255,255,.13);transform:translateY(-1px);}

  /* level grid */
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;
    max-height:52vh;overflow-y:auto;padding:6px 4px;margin:10px 0 2px;
    scrollbar-width:thin;scrollbar-color:rgba(120,200,255,.4) transparent;}
  .grid::-webkit-scrollbar{width:5px;}
  .grid::-webkit-scrollbar-thumb{background:rgba(120,200,255,.4);border-radius:3px;}
  .lvlbtn{aspect-ratio:1;border-radius:9px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);color:#cfe4ff;font-weight:800;font-size:12px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;font-family:inherit;transition:.15s;padding:2px;}
  .lvlbtn:hover{background:rgba(120,200,255,.18);transform:translateY(-2px);}
  .lvlbtn.locked{opacity:.25;cursor:not-allowed;transform:none!important;}
  .lvlbtn.done{border-color:rgba(125,255,176,.5);
    box-shadow:inset 0 0 12px rgba(125,255,176,.18);}
  .lvlbtn .st{font-size:8px;color:#ffd83d;letter-spacing:0;line-height:1;}
  .lvlbtn.active{background:rgba(255,216,61,.2);border-color:rgba(255,216,61,.6);}

  /* customization panel */
  .custom-section{margin:10px 0;text-align:left;}
  .custom-label{color:#9fd8ff;font-size:11px;font-weight:800;letter-spacing:1.6px;
    margin-bottom:6px;padding-left:4px;}
  .options{display:flex;gap:6px;flex-wrap:wrap;}
  .opt{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);color:#c3cddd;font-family:inherit;font-size:11.5px;
    font-weight:700;letter-spacing:.5px;cursor:pointer;transition:.15s;}
  .opt:hover{background:rgba(120,200,255,.14);}
  .opt.active{background:linear-gradient(180deg,rgba(120,200,255,.32),rgba(80,160,255,.22));
    border-color:rgba(140,210,255,.6);color:#fff;
    box-shadow:0 0 12px rgba(110,200,255,.3);}

  .preview-wrap{margin:8px auto 4px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(120,200,255,.18);box-shadow:0 8px 20px rgba(0,0,0,.4);
    background:#0a0e16;}
  .preview-wrap canvas{display:block;width:100%;height:auto;}

  @media (max-height:660px){
    .panel{padding:20px 16px;}
    .logo{font-size:38px;}
    .panel h1{font-size:25px;}
    .btn{padding:12px 26px;font-size:13.5px;}
    .grid{grid-template-columns:repeat(8,1fr);max-height:42vh;}
    .preview-wrap{display:none;}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="chip"><span>💰</span><span id="cash">$0</span></div>
      <div class="chip" id="lvl">LVL 1</div>
      <div class="chip hearts" id="lives"></div>
    </div>
    <div id="objective">🟢 PICK UP PASSENGER</div>
  </div>

  <div id="overlay"></div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   CANVAS & VIEW
   ========================================================= */
const cv      = document.getElementById('cv');
const ctx     = cv.getContext('2d');
const overlay = document.getElementById('overlay');
const hud     = document.getElementById('hud');
const cashEl  = document.getElementById('cash');
const lvlEl   = document.getElementById('lvl');
const livesEl = document.getElementById('lives');
const objEl   = document.getElementById('objective');

const TAU = Math.PI * 2;
const VIEW_Y = 0.72;
let W = 0, H = 0, DPR = 1, S = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth  || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  S = Math.max(0.42, Math.min(1.05, Math.min(W / 900, H / 800)));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 160));
resize();

/* =========================================================
   UTILITIES
   ========================================================= */
const clamp = (v,a,b)=> v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t)=> a + (b-a) * t;
const rand  = (a,b)=> a + Math.random() * (b - a);

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(n){
  n = (n ^ 61) ^ (n >>> 16);
  n = n + (n << 3);
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return (n >>> 0) / 4294967296;
}
function shade(hex, amt){
  const r0 = parseInt(hex.slice(1,3),16);
  const g0 = parseInt(hex.slice(3,5),16);
  const b0 = parseInt(hex.slice(5,7),16);
  let r,g,b;
  if (amt >= 0){ r = r0+(255-r0)*amt; g = g0+(255-g0)*amt; b = b0+(255-b0)*amt; }
  else { r = r0*(1+amt); g = g0*(1+amt); b = b0*(1+amt); }
  return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
}
function rr(c, x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

/* =========================================================
   BIOMES / ARCHETYPES / VEHICLES / CHARACTERS
   ========================================================= */
const BIOMES = {
  city:       { ground:'#1a2030', grid:'rgba(255,255,255,0.03)', sidewalk:'#5a6274', prop:'building',  water:'#1a3a5a' },
  park:       { ground:'#182a1e', grid:'rgba(255,255,255,0.03)', sidewalk:'#7a8574', prop:'tree',      water:'#1a4060' },
  industrial: { ground:'#241f1c', grid:'rgba(255,255,255,0.03)', sidewalk:'#6a6258', prop:'container', water:'#2a3a4a' },
  water:      { ground:'#12283a', grid:'rgba(255,255,255,0.03)', sidewalk:'#7a7a8a', prop:'palm',      water:'#0d3556' },
  desert:     { ground:'#2a2418', grid:'rgba(255,255,255,0.03)', sidewalk:'#a89b6f', prop:'cactus',    water:'#1a4a60' },
  forest:     { ground:'#16241a', grid:'rgba(255,255,255,0.03)', sidewalk:'#5a6a54', prop:'tree',      water:'#153a5a' }
};

const ARCHETYPES = [
  { id:'downtown', biome:'city',       amp:110, bridges:false, label:'DOWNTOWN'   },
  { id:'curves',   biome:'park',       amp:250, bridges:false, label:'GREENWAY'   },
  { id:'zigzag',   biome:'industrial', amp:280, bridges:false, label:'DOCKS'      },
  { id:'grid',     biome:'city',       amp:230, bridges:true,  label:'MIDTOWN'    },
  { id:'coastal',  biome:'water',      amp:200, bridges:true,  label:'COASTAL'    },
  { id:'highway',  biome:'desert',     amp:70,  bridges:true,  label:'OUTBACK'    },
  { id:'forest',   biome:'forest',     amp:170, bridges:false, label:'PINE RIDGE' }
];

const VEHICLE_COLORS = ['#e8483c','#3b7dd8','#f08a2c','#8a5bd6','#2fb98a','#d94f8c',
                        '#e8d24a','#4fc3d9','#c96a3d','#7a8ea8'];

const VEHICLE_KINDS = [
  { kind:'sedan', len:70,  wid:36, w: 30 },
  { kind:'suv',   len:82,  wid:40, w: 22 },
  { kind:'truck', len:112, wid:44, w: 12 },
  { kind:'van',   len:90,  wid:40, w: 14 },
  { kind:'bus',   len:140, wid:46, w:  6 },
  { kind:'sport', len:66,  wid:34, w: 16 }
];

const CHARACTERS = [
  { id:'taxi',    name:'Yellow Taxi',  color:'#ffc21a', kind:'taxi'    },
  { id:'sport',   name:'Red Sport',    color:'#e8483c', kind:'sport'   },
  { id:'police',  name:'Police',       color:'#2a2a3a', kind:'police'  },
  { id:'sedan',   name:'White Sedan',  color:'#e8e8e8', kind:'sedan'   },
  { id:'van',     name:'Green Van',    color:'#2fb98a', kind:'van'     }
];

const OBSTACLE_TYPES = [
  { id:'none',    name:'None'    },
  { id:'cones',   name:'Cones'   },
  { id:'barrels', name:'Barrels' },
  { id:'mixed',   name:'Mixed'   }
];

const DENSITY_OPTS = [
  { id:'low',    name:'Low',    mult: 0.55 },
  { id:'normal', name:'Normal', mult: 1.00 },
  { id:'high',   name:'High',   mult: 1.65 }
];

const SKINS  = ['#f2c49b','#d99b6c','#a86b3f','#8a5730','#f7d9b8','#c98e5e'];
const SHIRTS = ['#e8483c','#3b7dd8','#f08a2c','#8a5bd6','#2fb98a','#d94f8c','#e8d24a','#4fc3d9'];
const PANTS  = ['#2b3140','#3a4256','#1f2532','#4a5168'];
const HAIRS  = ['#1a1410','#3b2414','#6b4423','#0f0f12','#a9781f','#5a5a5a'];

function personPalette(rng){
  const r = rng || Math.random;
  const p = a => a[(r() * a.length) | 0];
  return { skin:p(SKINS), shirt:p(SHIRTS), pants:p(PANTS), hair:p(HAIRS) };
}

/* =========================================================
   ROAD SAMPLING
   ========================================================= */
function samplePath(path, d){
  if (d <= path[0].d) return path[0].x;
  for (let i = 0; i < path.length - 1; i++){
    if (d <= path[i+1].d){
      const t = (d - path[i].d) / (path[i+1].d - path[i].d);
      const s = t * t * (3 - 2 * t);
      return path[i].x + (path[i+1].x - path[i].x) * s;
    }
  }
  return path[path.length - 1].x;
}
function roadX(d){ return level ? samplePath(level.path, d) : 0; }
function roadSlope(d){
  const e = 12;
  return (roadX(d + e) - roadX(d - e)) / (2 * e);
}

/* =========================================================
   LEVEL GENERATION
   ========================================================= */
const TOTAL_LEVELS = 120;
const LEVEL_CACHE = new Map();

function inBridge(bridges, d, pad){
  if (!bridges) return false;
  for (const b of bridges){
    if (d > b.d0 - pad && d < b.d1 + pad) return true;
  }
  return false;
}

function genPath(arch, length, rng){
  const pts = [{ d:-400, x:0 }];
  const segs = Math.max(3, Math.round(length / 620));
  const amp = arch.amp;
  let x = 0;
  for (let i = 1; i <= segs; i++){
    const d = -400 + (length + 1000) * i / segs;
    let nx = x;
    switch (arch.id){
      case 'curves':  nx = Math.sin(i * 1.15 + 0.7) * amp; break;
      case 'zigzag':  nx = (i % 2 ? 1 : -1) * amp * (0.62 + rng() * 0.5); break;
      case 'grid':    nx = (i % 3 === 0) ? (rng() < 0.5 ? -1 : 1) * amp : x * 0.35; break;
      case 'coastal': nx = Math.cos(i * 0.85) * amp * 0.85; break;
      case 'highway': nx = (rng() - 0.5) * 70; break;
      case 'forest':  nx = Math.sin(i * 0.95 + 1.3) * amp; break;
      default:        nx = (rng() - 0.5) * amp; break;
    }
    x = nx;
    pts.push({ d: d, x: x });
  }
  pts.push({ d: length + 1200, x: x });
  return pts;
}

function genProps(path, length, roadW, biome, bridges, rng){
  const out = [];
  const step = biome === 'city' ? 210 : 260;
  const r = mulberry32(Math.floor(rng() * 1e9));

  for (let d = -600; d < length + 1000; d += step){
    for (let side = -1; side <= 1; side += 2){
      if (inBridge(bridges, d, 260)) continue;
      const count = 1 + ((r() * 2) | 0);
      for (let k = 0; k < count; k++){
        const off = roadW / 2 + 220 + r() * 320;
        const px = samplePath(path, d) + side * off + (r() - 0.5) * 60;
        const pd = d + r() * 170;
        let kind = BIOMES[biome].prop;
        if (biome === 'industrial') kind = r() < 0.72 ? 'container' : 'building';
        else if (biome === 'park' || biome === 'forest') kind = r() < 0.9 ? 'tree' : 'rock';
        else if (biome === 'city') kind = r() < 0.85 ? 'building' : 'tree';
        else if (biome === 'water') kind = r() < 0.8 ? 'palm' : 'rock';
        else if (biome === 'desert') kind = r() < 0.7 ? 'cactus' : 'rock';

        const pal = ['#38425a','#313a4d','#414d64','#2c3444','#49566f','#353f4e','#3d4759'];
        const cp = ['#c9432f','#2f6dc9','#c98a2f','#3f8a55','#8a3fa8','#2f8ac9'];

        out.push({
          d: pd, x: px, kind: kind,
          w: kind === 'building' ? 78 + r() * 118 : 30 + r() * 30,
          h: kind === 'building' ? 78 + r() * 118 : 30 + r() * 30,
          c: kind === 'building' ? pal[(r() * pal.length) | 0] : cp[(r() * cp.length) | 0],
          ac: r() > 0.5,
          r: 14 + r() * 16,
          tilt: (r() - 0.5) * 0.5
        });
      }
    }
  }
  return out;
}

function generateLevel(index, overrides){
  overrides = overrides || {};
  const seed = ((index + 1) * 2654435761) >>> 0;
  const rng = mulberry32(seed);
  const tier = Math.floor(index / 8);
  let arch;
  if (overrides.route){
    arch = ARCHETYPES.find(a => a.id === overrides.route) || ARCHETYPES[index % ARCHETYPES.length];
  } else {
    arch = ARCHETYPES[index % ARCHETYPES.length];
  }
  const biome = overrides.environment || arch.biome;

  const length = Math.round(2600 + tier * 150 + rng() * 640);
  const roadW = Math.round(clamp(330 - tier * 6, 238, 330));

  const path = genPath(arch, length, rng);

  const nInt = clamp(2 + Math.floor(tier * 0.55), 2, 8);
  const speedBase = 148 + tier * 10;
  const gapBase = Math.max(0.76, 1.95 - tier * 0.072);
  const intersections = [];
  for (let k = 0; k < nInt; k++){
    const dd = length * (0.14 + 0.78 * k / Math.max(1, nInt - 1)) + (rng() - 0.5) * 130;
    intersections.push({
      d: clamp(dd, 500, length - 300),
      speed: Math.round(speedBase * (0.9 + rng() * 0.28)),
      gap: gapBase * (0.85 + rng() * 0.35),
      phase: (k * 2) % 4,
      phaseTime: 0,
      cars: [],
      peds: [],
      spawnTimer: rng() * 1.2,
      pedSpawnTimer: rng() * 2
    });
  }

  const nStops = 4 + (tier >= 6 ? 2 : 0);
  const stops = [];
  for (let k = 0; k < nStops; k++){
    const dd = 420 + (length - 900) * (k / (nStops - 1));
    stops.push({
      d: dd,
      type: k % 2 === 0 ? 'pickup' : 'dropoff',
      done: false, missed: false, r: 88, ph: rng() * TAU
    });
  }

  const bridges = [];
  if (arch.bridges && rng() < 0.78){
    const count = 1 + (rng() < 0.35 ? 1 : 0);
    for (let k = 0; k < count; k++){
      const bd0 = length * (0.22 + 0.52 * rng());
      const bd1 = bd0 + 420 + rng() * 440;
      if (bd1 < length + 320) bridges.push({ d0: bd0, d1: bd1 });
    }
  }

  const props = genProps(path, length, roadW, biome, bridges, rng);

  /* obstacles */
  const obsType = overrides.obstacles || 'none';
  const obstacles = [];
  if (obsType !== 'none'){
    const nObs = 4 + Math.floor(tier * 0.6);
    for (let k = 0; k < nObs; k++){
      const dd = 500 + rng() * (length - 900);
      const kind = obsType === 'mixed' ? (rng() < 0.5 ? 'cone' : 'barrel') : (obsType === 'cones' ? 'cone' : 'barrel');
      const roadOff = (rng() - 0.5) * roadW * 0.55;
      obstacles.push({ d: dd, xOff: roadOff, kind: kind });
    }
  }

  /* crowd */
  const crowd = [];
  const nCrowd = 16 + Math.floor(rng() * 12);
  for (let k = 0; k < nCrowd; k++){
    const dd = rng() * length;
    if (inBridge(bridges, dd, 260)) continue;
    crowd.push({
      d: dd,
      off: (roadW / 2 + 60 + rng() * 74) * (rng() < 0.5 ? -1 : 1),
      speed: (rng() < 0.5 ? -1 : 1) * (12 + rng() * 22),
      phase: rng() * TAU,
      pal: personPalette(rng)
    });
  }

  return {
    id: index,
    name: arch.label + ' ' + String(index + 1).padStart(3, '0'),
    archetype: arch.id,
    biome: biome,
    length: length,
    roadW: roadW,
    path: path,
    intersections: intersections,
    stops: stops,
    bridges: bridges,
    props: props,
    obstacles: obstacles,
    crowd: crowd,
    tier: tier
  };
}

/* =========================================================
   SIGNAL SYSTEM
   ========================================================= */
const SIGNAL_DUR = [3.2, 0.7, 2.4, 0.7]; // playerGreen, playerYellow, crossGreen, crossYellow
const PHASE_PLAYER_GREEN = 0;
const PHASE_PLAYER_YELLOW = 1;
const PHASE_CROSS_GREEN = 2;
const PHASE_CROSS_YELLOW = 3;

function stepSignal(it, dt){
  it.phaseTime += dt;
  if (it.phaseTime >= SIGNAL_DUR[it.phase]){
    it.phaseTime -= SIGNAL_DUR[it.phase];
    it.phase = (it.phase + 1) % 4;
    if (it.phase === PHASE_CROSS_GREEN){
      spawnCrossPeds(it);
    }
  }
}

function crossLightState(it){
  if (it.phase === PHASE_PLAYER_GREEN || it.phase === PHASE_PLAYER_YELLOW) return 'red';
  if (it.phase === PHASE_CROSS_GREEN) return 'green';
  return 'yellow';
}
function playerLightState(it){
  if (it.phase === PHASE_PLAYER_GREEN) return 'green';
  if (it.phase === PHASE_PLAYER_YELLOW) return 'yellow';
  return 'red';
}

function spawnCrossCar(it){
  const side = Math.random() < 0.5 ? 1 : -1;
  const cx = roadX(it.d);
  const spec = pickKind(Math.random);
  const startX = cx + side * (level.roadW / 2 + 420);
  const dir = -side;
  const speed = it.speed * rand(0.85, 1.15);
  it.cars.push({
    x: startX,
    vx: dir * speed,
    baseVx: dir * speed,
    stopped: false,
    len: spec.len,
    wid: spec.wid,
    kind: spec.kind,
    color: VEHICLE_COLORS[(Math.random() * VEHICLE_COLORS.length) | 0],
    horn: 0
  });
}

function pickKind(rng){
  let total = 0;
  for (const k of VEHICLE_KINDS) total += k.w;
  let r = (rng ? rng() : Math.random()) * total;
  for (const k of VEHICLE_KINDS){ r -= k.w; if (r <= 0) return k; }
  return VEHICLE_KINDS[0];
}

function spawnCrossPeds(it){
  const cx = roadX(it.d);
  const rw = level.roadW;
  const sw = rw * 0.55;
  const zebraW = 34;
  const gap = 18;
  const zebraOffset = sw/2 + gap + zebraW/2;
  const count = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++){
    const fromLeft = Math.random() < 0.5;
    const ySign = Math.random() < 0.5 ? -1 : 1;
    it.peds.push({
      startX: fromLeft ? cx - rw/2 - 20 : cx + rw/2 + 20,
      endX: fromLeft ? cx + rw/2 + 20 : cx - rw/2 - 20,
      d: it.d + ySign * zebraOffset,
      t: 0,
      speed: 0.45 + Math.random() * 0.35,
      pal: personPalette()
    });
  }
}

function updateIntersection(it, dt){
  stepSignal(it, dt);

  const crossRed = it.phase === PHASE_PLAYER_GREEN || it.phase === PHASE_PLAYER_YELLOW;
  const crossGreen = it.phase === PHASE_CROSS_GREEN;

  /* Spawn cross traffic */
  if (!crossRed || Math.random() < 0.02){
    it.spawnTimer -= dt;
    if (it.spawnTimer <= 0){
      const density = progress.customizations[levelIndex] && progress.customizations[levelIndex].density;
      const mult = density ? (DENSITY_OPTS.find(d => d.id === density) || DENSITY_OPTS[1]).mult : 1;
      if (Math.random() < 0.9 || crossGreen){
        spawnCrossCar(it);
        it.spawnTimer = it.gap * rand(0.9, 1.6) / mult;
      } else {
        it.spawnTimer = 0.3;
      }
    }
  }

  /* Update cross cars */
  const cx = roadX(it.d);
  const halfRw = level.roadW / 2;
  const stopGap = 46;

  for (let i = it.cars.length - 1; i >= 0; i--){
    const car = it.cars[i];
    const movingRight = car.baseVx > 0;

    if (crossRed || it.phase === PHASE_CROSS_YELLOW){
      /* decelerate & stop at line */
      const stopX = movingRight
        ? cx - halfRw - stopGap - car.len/2
        : cx + halfRw + stopGap + car.len/2;
      const distToStop = movingRight ? (stopX - car.x) : (car.x - stopX);

      /* if car is approaching from outside the intersection and hasn't passed the line */
      const beforeLine = movingRight ? (car.x + car.len/2 < stopX + 4) : (car.x - car.len/2 > stopX - 4);

      if (beforeLine && distToStop > 0 && distToStop < 180 && car.vx !== 0){
        const decel = car.vx * car.vx / (2 * Math.max(30, distToStop));
        if (decel > 240) car.vx = Math.sign(car.vx) * Math.max(0, Math.abs(car.vx) - 900 * dt);
        else car.vx = Math.sign(car.vx) * Math.max(0, Math.abs(car.vx) - 500 * dt);
      }

      if (beforeLine && distToStop < 6){
        car.x = stopX;
        car.vx = 0;
        car.stopped = true;
      } else {
        car.x += car.vx * dt;
      }
    } else {
      if (car.stopped){
        car.vx = car.baseVx * 0.6;
        car.stopped = false;
      } else {
        car.vx += Math.sign(car.baseVx) * 260 * dt;
        if (Math.abs(car.vx) > Math.abs(car.baseVx)) car.vx = car.baseVx;
      }
      car.x += car.vx * dt;
    }

    /* remove off-screen */
    if (Math.abs(car.x - cx) > level.roadW / 2 + 620){
      it.cars.splice(i, 1);
    }
  }

  /* Update pedestrians */
  for (let i = it.peds.length - 1; i >= 0; i--){
    const p = it.peds[i];
    p.t += dt * p.speed;
    if (p.t >= 1.05) it.peds.splice(i, 1);
  }
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt){
  time += dt;
  const sdt = dt * timeScale;
  timeScale = Math.min(1, timeScale + dt * 1.6);
  shakeMag = Math.max(0, shakeMag - dt * 55);
  flash = Math.max(0, flash - dt * 2.6);

  if (fade.a !== fade.target){
    const dir = fade.target > fade.a ? 1 : -1;
    fade.a += dir * fade.speed * dt;
    if (dir > 0 && fade.a >= 1){
      fade.a = 1;
      const cb = fade.cb; fade.cb = null;
      if (cb) cb();
      fade.target = 0;
    } else if (dir < 0 && fade.a <= 0){
      fade.a = 0;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= sdt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.d += p.vd * sdt;
    p.x += p.vx * sdt;
    p.vx *= (1 - 2.1 * sdt);
    p.vd *= (1 - 2.1 * sdt);
    if (p.rot !== undefined) p.rot += p.spin * sdt;
  }
  for (let i = floaters.length - 1; i >= 0; i--){
    const f = floaters[i];
    f.life -= sdt;
    f.d += f.rise * sdt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  for (let i = walkers.length - 1; i >= 0; i--){
    const w = walkers[i];
    w.t += sdt;
    if (w.t >= w.dur) walkers.splice(i, 1);
  }

  if (state !== 'playing') return;

  updatePlayer(sdt);
  updateIntersections(sdt);
  updateZones(sdt);
  updateCamera(dt);
}

function updatePlayer(dt){
  const prevSpeed = player.speed;

  if (input.hold) player.speed += PHYS.accel * dt;
  else            player.speed -= PHYS.brake * dt;

  player.speed = clamp(player.speed, 0, PHYS.maxSpeed);
  if (!input.hold && player.speed < 6) player.speed = 0;

  if (!input.hold && prevSpeed > 190 && player.speed > 20){
    if (Math.random() < 0.85) spawnSmoke();
  }

  player.d += player.speed * dt;
  if (player.d < 0) player.d = 0;
  player.x = roadX(player.d);
  player.angle = Math.atan(roadSlope(player.d));

  if (player.invuln > 0) player.invuln -= dt;

  /* obstacle collisions */
  if (player.invuln <= 0 && level.obstacles){
    for (const obs of level.obstacles){
      if (Math.abs(obs.d - player.d) < 26 && Math.abs(roadX(obs.d) + obs.xOff - player.x) < 26){
        doCrash('hit obstacle');
        break;
      }
    }
  }

  if (player.d >= level.length) completeLevel();
}

function updateCamera(dt){
  const k = 1 - Math.pow(0.0012, dt);
  camera.x = lerp(camera.x, player.x, k);
}

function updateIntersections(dt){
  for (const it of level.intersections){
    const dist = Math.abs(it.d - player.d);
    if (dist > 1600) continue;
    updateIntersection(it, dt);

    /* collision detection */
    if (player.invuln <= 0){
      for (const car of it.cars){
        const dx = Math.abs(player.x - car.x);
        const dd = Math.abs(player.d - it.d);
        if (dx < car.len / 2 + 19 && dd < car.wid / 2 + 38){
          doCrash();
          break;
        }
      }
    }
  }
}

function doCrash(reason){
  player.invuln = 1.6;
  player.speed = 0;
  player.d = Math.max(0, player.d - 42);
  shakeMag = 24;
  flash = 1; flashColor = '255,60,60';
  lives--;
  runStats.crashes++;
  spawnFlames(player.d + 10, player.x, 30, 1);
  addFloater(player.x, player.d + 40, 'CRASH!', '#ff5a5a', 30);
  updateHUD();
  if (lives <= 0){
    setTimeout(() => {
      if (state === 'playing') gameOver();
    }, 320);
  }
}

function updateZones(dt){
  if (zoneIndex >= level.stops.length) return;
  const z = level.stops[zoneIndex];
  if (z.done || z.missed) return;
  const dist = player.d - z.d;
  if (Math.abs(dist) < z.r * 0.80 && player.speed < 25){
    completeZone(z);
    return;
  }
  if (dist > z.r * 1.4){
    z.missed = true;
    zoneIndex++;
    addFloater(roadX(z.d), z.d, 'MISSED', '#ff7a7a', 24);
    if (z.type === 'pickup'){
      if (zoneIndex < level.stops.length && level.stops[zoneIndex].type === 'dropoff'){
        level.stops[zoneIndex].missed = true;
        zoneIndex++;
      }
    }
    updateHUD();
    updateObjective();
  }
}

function completeZone(z){
  z.done = true;
  runStats.stops++;
  const off = Math.abs(player.d - z.d);
  const perfect = off < z.r * 0.42;
  if (perfect) runStats.perfects++;
  let label, color;
  if (z.type === 'pickup'){
    player.passengers = 1;
    score += 10;
    label = '+$10'; color = '#8dffb0';
    spawnWalker(z);
  } else {
    player.passengers = 0;
    const gain = perfect ? 150 : 100;
    score += gain;
    label = '+$' + gain; color = '#7fd8ff';
    burstConfetti(z.d, roadX(z.d), 34);
  }
  addFloater(roadX(z.d), z.d, label, color, 30);
  if (perfect){
    addFloater(roadX(z.d), z.d + 70, 'PERFECT STOP!', '#ffe66d', 26);
    shakeMag = Math.max(shakeMag, 7);
  } else {
    shakeMag = Math.max(shakeMag, 4);
  }
  zoneIndex++;
  updateHUD();
  updateObjective();
}

/* =========================================================
   PREVIEW CANVAS
   ========================================================= */
function drawPreview(){
  const canvas = document.getElementById('previewCanvas');
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const pw = canvas.width, ph = canvas.height;

  const idx = selectedLevel;
  const custom = progress.customizations[idx] || {};
  const lvl = generateLevel(idx, custom);

  /* Background */
  const biome = BIOMES[lvl.biome];
  const bg = c.createLinearGradient(0, 0, 0, ph);
  bg.addColorStop(0, '#0a0e18');
  bg.addColorStop(1, biome.ground);
  c.fillStyle = bg;
  c.fillRect(0, 0, pw, ph);

  /* Path preview */
  const d0 = 0, d1 = lvl.length;
  const xMin = -400, xMax = 400;
  c.strokeStyle = 'rgba(120,200,255,.15)';
  c.lineWidth = 1;
  for (let i = 1; i < 4; i++){
    const y = ph * i / 4;
    c.beginPath(); c.moveTo(0, y); c.lineTo(pw, y); c.stroke();
  }

  c.strokeStyle = biome.sidewalk;
  c.lineWidth = 10;
  c.lineCap = 'round';
  c.beginPath();
  for (let i = 0; i <= 80; i++){
    const d = d0 + (d1 - d0) * i / 80;
    const x = samplePath(lvl.path, d);
    const px = pw / 2 + (x - (xMin + xMax) / 2) / (xMax - xMin) * (pw - 40);
    const py = ph - 12 - (ph - 24) * i / 80;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.stroke();

  c.strokeStyle = '#3c414d';
  c.lineWidth = 6;
  c.stroke();

  c.strokeStyle = '#ffd23f';
  c.lineWidth = 1;
  c.setLineDash([4, 4]);
  c.stroke();
  c.setLineDash([]);

  /* Intersections */
  for (const it of lvl.intersections){
    const x = samplePath(lvl.path, it.d);
    const px = pw / 2 + (x - (xMin + xMax) / 2) / (xMax - xMin) * (pw - 40);
    const py = ph - 12 - (ph - 24) * it.d / d1;
    c.fillStyle = 'rgba(255,216,61,.7)';
    c.beginPath(); c.arc(px, py, 4, 0, TAU); c.fill();
  }

  /* Stops */
  for (const s of lvl.stops){
    const x = samplePath(lvl.path, s.d);
    const px = pw / 2 + (x - (xMin + xMax) / 2) / (xMax - xMin) * (pw - 40);
    const py = ph - 12 - (ph - 24) * s.d / d1;
    c.fillStyle = s.type === 'pickup' ? '#5dff9e' : '#6ec8ff';
    c.beginPath(); c.arc(px, py, 3.5, 0, TAU); c.fill();
  }

  /* Player start */
  c.fillStyle = '#ffc21a';
  c.beginPath(); c.arc(pw / 2, ph - 12, 5, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,216,61,.6)';
  c.lineWidth = 2;
  c.beginPath(); c.arc(pw / 2, ph - 12, 7, 0, TAU); c.stroke();
}

/* =========================================================
   OVERLAY EVENTS
   ========================================================= */
overlay.addEventListener('click', function(e){
  const lvlBtn = e.target.closest('[data-level]');
  const custBtn = e.target.closest('[data-custom]');
  const actBtn = e.target.closest('[data-action]');

  /* customization option */
  if (custBtn && !actBtn){
    const lvlIdx = selectedLevel;
    const key = custBtn.getAttribute('data-custom');
    const val = custBtn.getAttribute('data-value');
    if (!progress.customizations[lvlIdx]) progress.customizations[lvlIdx] = {};
    progress.customizations[lvlIdx][key] = val;
    saveProgress();
    showOverlay(customizeHTML(lvlIdx));
    requestAnimationFrame(drawPreview);
    return;
  }

  /* level button */
  if (lvlBtn && lvlBtn.classList.contains('lvlbtn') && !lvlBtn.disabled){
    selectedLevel = parseInt(lvlBtn.getAttribute('data-level'), 10);
    showOverlay(customizeHTML(selectedLevel));
    requestAnimationFrame(drawPreview);
    return;
  }

  if (!actBtn) return;
  const a = actBtn.getAttribute('data-action');

  if (a === 'continue'){
    const idx = Math.min(progress.unlocked - 1, TOTAL_LEVELS - 1);
    selectedLevel = idx;
    showOverlay(customizeHTML(idx));
    requestAnimationFrame(drawPreview);
  } else if (a === 'play'){
    const idx = parseInt(actBtn.getAttribute('data-level'), 10);
    hideOverlay();
    fadeOut(() => { startRun(idx); });
  } else if (a === 'levels'){
    state = 'levelselect';
    showOverlay(levelSelectHTML());
  } else if (a === 'next'){
    hideOverlay();
    fadeOut(() => {
      startRun(levelIndex + 1);
    });
  } else if (a === 'retry'){
    hideOverlay();
    fadeOut(() => { startRun(levelIndex); });
  } else if (a === 'menu'){
    hideOverlay();
    fadeOut(() => {
      level = null;
      state = 'menu';
      showOverlay(menuHTML());
    });
  }
});

/* =========================================================
   INPUT
   ========================================================= */
function press(){ if (state === 'playing') input.hold = true; }
function releaseInput(){ input.hold = false; }

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    e.preventDefault(); press();
  }
}, { passive: false });
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    e.preventDefault(); releaseInput();
  }
}, { passive: false });
cv.addEventListener('mousedown', (e) => { e.preventDefault(); press(); });
window.addEventListener('mouseup', () => releaseInput());
cv.addEventListener('touchstart', (e) => { e.preventDefault(); press(); }, { passive: false });
window.addEventListener('touchend', (e) => { e.preventDefault(); releaseInput(); }, { passive: false });
window.addEventListener('touchcancel', () => releaseInput());
window.addEventListener('blur', () => releaseInput());

/* =========================================================
   DRAWING — VEHICLES
   ========================================================= */
function drawVehicle(c, spec){
  const len = spec.len, wid = spec.wid;
  const hw = wid / 2, hl = len / 2;
  const color = spec.color;
  const kind = spec.kind;

  /* shadow */
  c.save();
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.beginPath();
  c.ellipse(4, 6, hw + 4, hl + 4, 0, 0, TAU);
  c.fill();
  c.restore();

  /* wheels */
  const ww = 8, wh = 18, wx = hw - 1;
  const wy = (kind === 'bus' || kind === 'truck') ? [-hl + 28, hl - 28]
    : (kind === 'sport' ? [-hl + 19, hl - 19] : [-hl + 21, hl - 21]);
  c.fillStyle = '#0f1116';
  for (let i = 0; i < wy.length; i++){
    rr(c, -wx - ww, wy[i] - wh/2, ww, wh, 3); c.fill();
    rr(c,  wx,     wy[i] - wh/2, ww, wh, 3); c.fill();
  }

  /* body */
  const g = c.createLinearGradient(-hw, 0, hw, 0);
  g.addColorStop(0.00, shade(color, -0.46));
  g.addColorStop(0.16, shade(color, -0.06));
  g.addColorStop(0.42, shade(color,  0.28));
  g.addColorStop(0.70, shade(color,  0.02));
  g.addColorStop(1.00, shade(color, -0.46));
  c.fillStyle = g;
  rr(c, -hw, -hl, wid, len, 12);
  c.fill();

  /* hood shading */
  c.fillStyle = 'rgba(0,0,0,0.10)';
  rr(c, -hw + 5, -hl + 4, wid - 10, 14, 6);
  c.fill();

  /* windshield */
  const wg = c.createLinearGradient(0, -hl * 0.38, 0, 0);
  wg.addColorStop(0, 'rgba(210,240,255,0.96)');
  wg.addColorStop(1, 'rgba(68,138,200,0.88)');
  c.fillStyle = wg;
  c.beginPath();
  c.moveTo(-hw + 7, -hl * 0.38);
  c.lineTo( hw - 7, -hl * 0.38);
  c.lineTo( hw - 9, -hl * 0.06);
  c.lineTo(-hw + 9, -hl * 0.06);
  c.closePath();
  c.fill();

  /* roof */
  c.fillStyle = shade(color, -0.17);
  rr(c, -hw + 5, -hl * 0.06, wid - 10, hl * 0.70, 7);
  c.fill();
  c.fillStyle = 'rgba(255,255,255,0.10)';
  rr(c, -hw + 9, -hl * 0.01, wid - 18, hl * 0.48, 5);
  c.fill();

  /* rear window */
  c.fillStyle = 'rgba(128,188,232,0.78)';
  c.beginPath();
  c.moveTo(-hw + 9, hl * 0.62);
  c.lineTo( hw - 9, hl * 0.62);
  c.lineTo( hw - 7, hl * 0.84);
  c.lineTo(-hw + 7, hl * 0.84);
  c.closePath();
  c.fill();

  /* kind-specific */
  if (kind === 'truck'){
    const cabEnd = -hl + len * 0.36;
    c.fillStyle = shade(color, -0.30);
    rr(c, -hw + 1, cabEnd, wid - 2, hl - cabEnd - 4, 5); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.35)';
    c.lineWidth = 1.5;
    for (let i = 1; i < 4; i++){
      const yy = cabEnd + (hl - cabEnd) * i / 4;
      c.beginPath(); c.moveTo(-hw + 3, yy); c.lineTo(hw - 3, yy); c.stroke();
    }
  } else if (kind === 'bus'){
    c.fillStyle = 'rgba(140,205,245,0.85)';
    for (let i = 0; i < 4; i++){
      const yy = -hl * 0.28 + i * hl * 0.22;
      rr(c, -hw + 3, yy, 7, hl * 0.13, 2); c.fill();
      rr(c,  hw - 10, yy, 7, hl * 0.13, 2); c.fill();
    }
    c.fillStyle = 'rgba(255,255,255,0.12)';
    rr(c, -hw + 10, -hl * 0.05, wid - 20, hl * 0.6, 5); c.fill();
  } else if (kind === 'suv'){
    c.strokeStyle = 'rgba(0,0,0,0.30)';
    c.lineWidth = 2.5;
    c.beginPath();
    c.moveTo(-hw + 8, -hl * 0.02); c.lineTo(hw - 8, -hl * 0.02);
    c.moveTo(-hw + 8, -hl * 0.02 + 8); c.lineTo(hw - 8, -hl * 0.02 + 8);
    c.stroke();
  } else if (kind === 'sport'){
    c.fillStyle = shade(color, -0.55);
    rr(c, -hw + 2, hl * 0.72, wid - 4, 7, 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.18)';
    rr(c, -hw + 4, -hl * 0.30, wid - 8, 4, 2); c.fill();
  } else if (kind === 'van'){
    c.fillStyle = 'rgba(0,0,0,0.16)';
    rr(c, -hw + 4, -hl * 0.05, 3, hl * 0.6, 1.5); c.fill();
  } else if (kind === 'police'){
    c.fillStyle = '#0d0f14';
    rr(c, -14, -hl * 0.03, 28, 14, 3.5); c.fill();
    c.fillStyle = '#ff3030';
    c.fillRect(-9, 1, 8, 5);
    c.fillStyle = '#3080ff';
    c.fillRect(1, 1, 8, 5);
    c.fillStyle = '#ffffff';
    rr(c, -hw + 3, hl * 0.20, 4, 20, 2); c.fill();
    rr(c,  hw - 7, hl * 0.20, 4, 20, 2); c.fill();
  }

  /* headlights / taillights */
  c.fillStyle = '#fff7cf';
  rr(c, -hw + 4, -hl + 1, 9, 5, 2); c.fill();
  rr(c,  hw - 13, -hl + 1, 9, 5, 2); c.fill();
  c.fillStyle = '#ff3b30';
  rr(c, -hw + 4, hl - 6, 9, 5, 2); c.fill();
  rr(c,  hw - 13, hl - 6, 9, 5, 2); c.fill();

  /* taxi extras */
  if (kind === 'taxi'){
    c.fillStyle = '#12141a';
    for (let i = 0; i < 4; i++){
      const yy = hl * 0.10 + i * 8;
      c.fillRect(-hw + 1, yy, 4.5, 4.5);
      c.fillRect( hw - 5.5, yy + 4, 4.5, 4.5);
    }
    c.fillStyle = '#0d0f14';
    rr(c, -12, -hl * 0.02, 24, 12, 3.5); c.fill();
    c.fillStyle = '#ffdd44';
    c.fillRect(-8.5, 1.5, 5, 4.5);
    c.fillRect( 3.5, 1.5, 5, 4.5);
  }
}

/* =========================================================
   DRAWING — PEOPLE
   ========================================================= */
function drawPerson(c, phase, pal){
  const legSwing = Math.sin(phase) * 5;
  const armSwing = Math.sin(phase + Math.PI) * 4;

  c.save();

  c.fillStyle = 'rgba(0,0,0,0.32)';
  c.beginPath();
  c.ellipse(0, 11, 9, 4, 0, 0, TAU);
  c.fill();

  c.strokeStyle = pal.pants;
  c.lineWidth = 5;
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(-3, 2); c.lineTo(-3 + legSwing, 11); c.stroke();
  c.beginPath(); c.moveTo( 3, 2); c.lineTo( 3 - legSwing, 11); c.stroke();

  c.strokeStyle = pal.skin;
  c.lineWidth = 4;
  c.beginPath(); c.moveTo(-6, -6); c.lineTo(-9 + armSwing, 2); c.stroke();
  c.beginPath(); c.moveTo( 6, -6); c.lineTo( 9 - armSwing, 2); c.stroke();

  c.fillStyle = pal.shirt;
  rr(c, -7, -8, 14, 14, 5);
  c.fill();

  c.fillStyle = pal.skin;
  c.beginPath(); c.arc(0, -14, 6, 0, TAU); c.fill();

  c.fillStyle = pal.hair;
  c.beginPath(); c.arc(0, -15.5, 6, Math.PI, TAU); c.fill();

  c.restore();
}

/* =========================================================
   DRAWING — PROPS
   ========================================================= */
function drawProp(p){
  switch (p.kind){
    case 'building': {
      const w = p.w, h = p.h;
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      rr(ctx, -w/2 + 7, -h/2 + 9, w, h, 9); ctx.fill();
      ctx.fillStyle = p.c;
      rr(ctx, -w/2, -h/2, w, h, 9); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.32)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.055)';
      rr(ctx, -w/2 + 13, -h/2 + 13, w - 26, h - 26, 6); ctx.fill();

      /* windows */
      ctx.fillStyle = 'rgba(255,214,140,0.35)';
      const cols = Math.max(2, Math.floor(w / 26));
      const rows = Math.max(2, Math.floor(h / 30));
      for (let r = 0; r < rows; r++){
        for (let c2 = 0; c2 < cols; c2++){
          if ((r + c2 + p.r) % 3 === 0) continue;
          const wx = -w/2 + 18 + c2 * (w - 36) / Math.max(1, cols - 1) - 4;
          const wy = -h/2 + 20 + r * (h - 40) / Math.max(1, rows - 1) - 5;
          ctx.fillRect(wx, wy, 6, 8);
        }
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w/2 + 10, -h/2 + 3);
      ctx.lineTo( w/2 - 10, -h/2 + 3);
      ctx.stroke();
      if (p.ac){
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        rr(ctx, w*0.05, h*0.05, 20, 16, 3); ctx.fill();
      }
      break;
    }
    case 'tree': {
      const r = p.r;
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.beginPath(); ctx.ellipse(6, 8, r, r * 0.9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(p.c, -0.30);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(p.c, 0.16);
      ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.28, r * 0.72, 0, TAU); ctx.fill();
      ctx.fillStyle = shade(p.c, 0.36);
      ctx.beginPath(); ctx.arc(-r * 0.44, -r * 0.44, r * 0.34, 0, TAU); ctx.fill();
      break;
    }
    case 'container': {
      const w = p.w, h = p.h;
      ctx.fillStyle = 'rgba(0,0,0,0.40)';
      rr(ctx, -w/2 + 6, -h/2 + 8, w, h, 4); ctx.fill();
      ctx.fillStyle = p.c;
      rr(ctx, -w/2, -h/2, w, h, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      for (let i = 1; i < 5; i++){
        const x = -w/2 + w * i / 5;
        ctx.beginPath(); ctx.moveTo(x, -h/2 + 3); ctx.lineTo(x, h/2 - 3); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-w/2 + 3, -h/2 + 3); ctx.lineTo(w/2 - 3, -h/2 + 3); ctx.stroke();
      break;
    }
    case 'palm': {
      const r = p.r;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(6, 10, r * 0.85, r * 0.45, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#6b4f2a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, -r * 0.6); ctx.stroke();
      ctx.fillStyle = '#2f8a4a';
      for (let i = 0; i < 6; i++){
        const a = (i / 6) * TAU + p.tilt;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * r * 0.55, -r * 0.6 + Math.sin(a) * r * 0.55,
                    r * 0.62, r * 0.22, a, 0, TAU);
        ctx.fill();
      }
      break;
    }
    case 'cactus': {
      const r = p.r;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(5, 9, r * 0.8, r * 0.4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3f8a4a';
      rr(ctx, -r * 0.26, -r * 1.1, r * 0.52, r * 1.6, r * 0.24); ctx.fill();
      rr(ctx, -r * 0.9, -r * 0.4, r * 0.55, r * 0.26, r * 0.13); ctx.fill();
      rr(ctx,  r * 0.35, -r * 0.75, r * 0.55, r * 0.26, r * 0.13); ctx.fill();
      break;
    }
    default: {
      const r = p.r;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(5, 7, r * 0.9, 0, TAU); ctx.fill();
      ctx.fillStyle = '#4a4f5e';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.9, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5b6172';
      ctx.beginPath(); ctx.arc(-r * 0.22, -r * 0.22, r * 0.5, 0, TAU); ctx.fill();
    }
  }
}

/* =========================================================
   DRAWING — WORLD
   ========================================================= */
function viewRect(){
  const halfW = W / (2 * S);
  const r0 = -(H * VIEW_Y) / S;
  const r1 =  (H * (1 - VIEW_Y)) / S;
  return { x0: camera.x - halfW, x1: camera.x + halfW, r0, r1, d0: player.d - r1, d1: player.d - r0 };
}

function drawGround(V){
  const b = BIOMES[level.biome];
  ctx.fillStyle = b.ground;
  ctx.fillRect(V.x0, V.r0, V.x1 - V.x0, V.r1 - V.r0);

  ctx.strokeStyle = b.grid;
  ctx.lineWidth = 2;
  ctx.beginPath();
  const gs = 140;
  const gx0 = Math.floor(V.x0 / gs) * gs;
  for (let x = gx0; x < V.x1; x += gs){
    ctx.moveTo(x, V.r0); ctx.lineTo(x, V.r1);
  }
  const dTop = Math.ceil((player.d - V.r0) / gs) * gs;
  for (let d = dTop; d > player.d - V.r1; d -= gs){
    const y = player.d - d;
    ctx.moveTo(V.x0, y); ctx.lineTo(V.x1, y);
  }
  ctx.stroke();

  /* water under bridges */
  for (const br of level.bridges){
    const y0 = player.d - br.d1;
    const y1 = player.d - br.d0;
    if (y1 < V.r0 || y0 > V.r1) continue;
    const wg = ctx.createLinearGradient(0, y0, 0, y1);
    wg.addColorStop(0, b.water);
    wg.addColorStop(0.5, shade(b.water, 0.15));
    wg.addColorStop(1, b.water);
    ctx.fillStyle = wg;
    ctx.fillRect(V.x0, y0, V.x1 - V.x0, y1 - y0);

    ctx.strokeStyle = 'rgba(150,225,255,0.14)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let y = Math.max(y0, V.r0); y < Math.min(y1, V.r1); y += 26){
      for (let x = V.x0; x < V.x1; x += 44){
        const wy = y + Math.sin(x * 0.02 + time * 2.2) * 3;
        if (x === V.x0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
      }
    }
    ctx.stroke();
  }
}

function drawProps(V){
  for (const p of level.props){
    if (p.d < V.d0 - 320 || p.d > V.d1 + 320) continue;
    ctx.save();
    ctx.translate(p.x, player.d - p.d);
    drawProp(p);
    ctx.restore();
  }
}

function roadPoly(offL, offR, d0, d1, step){
  const n = Math.max(2, Math.ceil((d1 - d0) / step));
  ctx.beginPath();
  for (let i = 0; i <= n; i++){
    const d = d0 + (d1 - d0) * i / n;
    ctx.lineTo(roadX(d) + offR, player.d - d);
  }
  for (let i = n; i >= 0; i--){
    const d = d0 + (d1 - d0) * i / n;
    ctx.lineTo(roadX(d) + offL, player.d - d);
  }
  ctx.closePath();
}

function isInIntersectionZone(d){
  for (const it of level.intersections){
    const sw = level.roadW * 0.55;
    const margin = sw / 2 + 200;
    if (Math.abs(d - it.d) < margin) return true;
  }
  return false;
}

function drawRoad(V){
  const d0 = Math.max(-460, V.d0 - 160);
  const d1 = Math.min(level.length + 600, V.d1 + 160);
  const rw = level.roadW;
  const b = BIOMES[level.biome];

  /* sidewalk base */
  roadPoly(-rw/2 - 90, rw/2 + 90, d0, d1, 44);
  ctx.fillStyle = b.sidewalk; ctx.fill();

  /* grass edge */
  roadPoly(-rw/2 - 76, rw/2 + 76, d0, d1, 44);
  ctx.fillStyle = '#2e9c52'; ctx.fill();

  roadPoly(-rw/2 - 44, rw/2 + 44, d0, d1, 44);
  ctx.fillStyle = '#37b45e'; ctx.fill();

  /* curb */
  roadPoly(-rw/2 - 32, rw/2 + 32, d0, d1, 44);
  ctx.fillStyle = '#7a8492'; ctx.fill();

  /* asphalt */
  roadPoly(-rw/2, rw/2, d0, d1, 34);
  ctx.fillStyle = '#3a404c'; ctx.fill();

  /* banding */
  ctx.save();
  roadPoly(-rw/2, rw/2, d0, d1, 34);
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.055)';
  for (let d = Math.floor(d0 / 160) * 160; d < d1; d += 160){
    const y = player.d - d;
    ctx.fillRect(V.x0 - 240, y - 34, (V.x1 - V.x0) + 480, 34);
  }
  ctx.restore();

  /* white edges */
  roadPoly(-rw/2 + 11, -rw/2 + 19, d0, d1, 44);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  roadPoly( rw/2 - 19,  rw/2 - 11, d0, d1, 44);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();

  /* dashed centre line — skip intersections */
  ctx.fillStyle = '#ffd23f';
  const startD = Math.floor(d0 / 92) * 92;
  for (let d = startD; d < d1; d += 92){
    const a = d, bb = d + 50;
    if (bb < d0 || a > d1) continue;
    if (isInIntersectionZone(a) || isInIntersectionZone(bb)) continue;
    const xa = roadX(a), xb = roadX(bb);
    ctx.beginPath();
    ctx.moveTo(xa - 3.5, player.d - a);
    ctx.lineTo(xa + 3.5, player.d - a);
    ctx.lineTo(xb + 3.5, player.d - bb);
    ctx.lineTo(xb - 3.5, player.d - bb);
    ctx.closePath();
    ctx.fill();
  }
}

function drawIntersection(V, it){
  const cx = roadX(it.d);
  const cy = player.d - it.d;
  const rw = level.roadW;
  const sw = rw * 0.55;
  const zebraW = 34;
  const gap = 18;
  const b = BIOMES[level.biome];

  /* Side road (horizontal strip) */
  ctx.fillStyle = b.sidewalk;
  ctx.fillRect(V.x0 - 100, cy - sw/2 - 90, (V.x1 - V.x0) + 200, sw + 180);

  ctx.fillStyle = '#37b45e';
  ctx.fillRect(V.x0 - 100, cy - sw/2 - 76, (V.x1 - V.x0) + 200, sw + 152);

  ctx.fillStyle = '#3a404c';
  ctx.fillRect(V.x0 - 100, cy - sw/2, (V.x1 - V.x0) + 200, sw);

  /* side road lane lines */
  ctx.fillStyle = 'rgba(255,210,63,0.55)';
  for (let x = V.x0 - 60; x < V.x1 + 60; x += 46){
    if (Math.abs(x - cx) < rw/2 + 12) continue;
    ctx.fillRect(x, cy - 2, 26, 4);
  }

  /* side road edges */
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.fillRect(V.x0 - 100, cy - sw/2 + 4, (V.x1 - V.x0) + 200, 3);
  ctx.fillRect(V.x0 - 100, cy + sw/2 - 7, (V.x1 - V.x0) + 200, 3);

  /* intersection box (fresh asphalt) */
  ctx.fillStyle = '#3a404c';
  ctx.fillRect(cx - rw/2, cy - sw/2, rw, sw);

  /* zebra crossings on main road (north & south) */
  const zebraOffset = sw/2 + gap + zebraW/2;
  drawZebra(ctx, cx, cy - zebraOffset, rw, zebraW, 'h');
  drawZebra(ctx, cx, cy + zebraOffset, rw, zebraW, 'h');

  /* side road zebras (left & right of intersection box) */
  drawZebra(ctx, cx - rw/2 - gap - zebraW/2, cy, sw, zebraW, 'v');
  drawZebra(ctx, cx + rw/2 + gap + zebraW/2, cy, sw, zebraW, 'v');

  /* Player stop line (before entering from south) */
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const stopLineY = cy + zebraOffset + zebraW/2 + 16;
  ctx.fillRect(cx - rw/2 + 12, stopLineY, rw - 24, 4);
  const stopLineYN = cy - zebraOffset - zebraW/2 - 16;
  ctx.fillRect(cx - rw/2 + 12, stopLineYN, rw - 24, 4);

  /* Traffic lights at corners */
  const lightPositions = [
    { x: cx - rw/2 - 30, y: cy - sw/2 - 30, facing: 'south' },
    { x: cx + rw/2 + 30, y: cy - sw/2 - 30, facing: 'south' },
    { x: cx - rw/2 - 30, y: cy + sw/2 + 30, facing: 'north' },
    { x: cx + rw/2 + 30, y: cy + sw/2 + 30, facing: 'north' }
  ];
  const pState = playerLightState(it);
  const cState = crossLightState(it);
  for (const lp of lightPositions){
    const isPlayerSide = lp.facing === 'south' || lp.facing === 'north';
    drawTrafficLight(ctx, lp.x, lp.y, isPlayerSide ? pState : cState, lp.facing);
  }
}

function drawZebra(c, x, y, width, height, orient){
  c.fillStyle = 'rgba(240,240,240,0.92)';
  if (orient === 'h'){
    /* horizontal band, vertical stripes */
    const stripeW = 10;
    const stripeGap = 10;
    const startX = x - width/2 + 6;
    const endX = x + width/2 - 6;
    for (let sx = startX; sx < endX; sx += stripeW + stripeGap){
      c.fillRect(sx, y - height/2 + 3, stripeW, height - 6);
    }
  } else {
    /* vertical band, horizontal stripes */
    const stripeW = 10;
    const stripeGap = 10;
    const startY = y - width/2 + 6;
    const endY = y + width/2 - 6;
    for (let sy = startY; sy < endY; sy += stripeW + stripeGap){
      c.fillRect(x - height/2 + 3, sy, height - 6, stripeW);
    }
  }
}

function drawTrafficLight(c, x, y, state, facing){
  /* pole */
  c.fillStyle = '#2a2f38';
  c.fillRect(x - 3, y - 24, 6, 24);

  /* housing */
  const boxW = 14, boxH = 30;
  const bx = x - boxW/2;
  const by = y - 24 - boxH;

  c.fillStyle = '#1a1e26';
  rr(c, bx, by, boxW, boxH, 4);
  c.fill();

  c.strokeStyle = '#0d0f14';
  c.lineWidth = 1.5;
  c.stroke();

  /* lamps */
  const lampR = 4;
  const lampX = x;
  const redOn = state === 'red';
  const yellowOn = state === 'yellow';
  const greenOn = state === 'green';

  /* red */
  c.fillStyle = redOn ? '#ff3030' : '#3a1a1a';
  if (redOn){
    c.shadowColor = '#ff4040'; c.shadowBlur = 10;
  }
  c.beginPath(); c.arc(lampX, by + 6, lampR, 0, TAU); c.fill();
  c.shadowBlur = 0;

  /* yellow */
  c.fillStyle = yellowOn ? '#ffcc00' : '#3a3018';
  if (yellowOn){
    c.shadowColor = '#ffd040'; c.shadowBlur = 10;
  }
  c.beginPath(); c.arc(lampX, by + 15, lampR, 0, TAU); c.fill();
  c.shadowBlur = 0;

  /* green */
  c.fillStyle = greenOn ? '#30ff60' : '#1a3a1a';
  if (greenOn){
    c.shadowColor = '#40ff70'; c.shadowBlur = 10;
  }
  c.beginPath(); c.arc(lampX, by + 24, lampR, 0, TAU); c.fill();
  c.shadowBlur = 0;
}

function drawBridges(V){
  for (const br of level.bridges){
    if (br.d1 < V.d0 - 220 || br.d0 > V.d1 + 220) continue;
    const d0 = Math.max(br.d0 - 40, V.d0 - 200);
    const d1 = Math.min(br.d1 + 40, V.d1 + 200);
    const rw = level.roadW;

    ctx.save();
    roadPoly(-rw/2 - 60, rw/2 + 60, d0, d1, 44);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fill();
    ctx.restore();

    for (let side = -1; side <= 1; side += 2){
      const off = side * (rw/2 + 8);

      ctx.strokeStyle = 'rgba(150,175,205,0.85)';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      let first = true;
      for (let d = d0; d <= d1; d += 26){
        const x = roadX(d) + off;
        const y = player.d - d;
        if (first){ ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.fillStyle = '#5d6b7f';
      for (let d = Math.ceil(d0 / 90) * 90; d <= d1; d += 90){
        const x = roadX(d) + off;
        const y = player.d - d;
        ctx.fillRect(x - 4, y - 4, 8, 8);
      }

      ctx.fillStyle = 'rgba(28,36,48,0.65)';
      for (let d = Math.ceil(d0 / 120) * 120; d <= d1; d += 120){
        const x = roadX(d) + off * 1.12;
        const y = player.d - d;
        ctx.beginPath();
        ctx.ellipse(x, y + 22, 9, 16, 0, 0, TAU);
        ctx.fill();
      }
    }
  }
}

function drawObstacles(V){
  if (!level.obstacles) return;
  for (const obs of level.obstacles){
    if (obs.d < V.d0 - 200 || obs.d > V.d1 + 200) continue;
    const x = roadX(obs.d) + obs.xOff;
    const y = player.d - obs.d;
    ctx.save();
    ctx.translate(x, y);

    if (obs.kind === 'cone'){
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(2, 6, 12, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(11, 8); ctx.lineTo(-11, 8); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-5, -2); ctx.lineTo(5, -2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, 4); ctx.lineTo(8, 4); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(2, 6, 13, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e0c020';
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.clip();
      ctx.fillRect(-14, -4, 28, 8);
      ctx.restore();
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
}

/* =========================================================
   DRAWING — ZONES / TRAFFIC / PLAYER
   ========================================================= */
function drawZones(){
  for (let i = 0; i < level.stops.length; i++){
    const z = level.stops[i];
    if (z.done || z.missed) continue;
    if (Math.abs(z.d - player.d) > 1700) continue;
    const x = roadX(z.d);
    const y = player.d - z.d;
    const active = (i === zoneIndex);
    const pulse = 0.5 + 0.5 * Math.sin(time * 5 + z.ph);
    const R = z.r;

    ctx.save();
    ctx.translate(x, y);

    if (z.type === 'pickup'){
      const g = ctx.createRadialGradient(0, 0, R * 0.15, 0, 0, R);
      g.addColorStop(0, `rgba(80,255,150,${active ? 0.42 : 0.16})`);
      g.addColorStop(1, 'rgba(80,255,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();

      ctx.strokeStyle = `rgba(120,255,180,${active ? 0.95 : 0.38})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, R * (0.85 + 0.09 * pulse), 0, TAU); ctx.stroke();

      ctx.strokeStyle = `rgba(120,255,180,${active ? 0.55 : 0.2})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.52, 0, TAU); ctx.stroke();

      ctx.globalAlpha = active ? 0.9 : 0.4;
      drawPerson(ctx, time * 6, { skin:'#f2c49b', shirt:'#3b7dd8', pants:'#2b3140', hair:'#3b2414' });
      ctx.globalAlpha = 1;
    } else {
      const g = ctx.createRadialGradient(0, 0, R * 0.15, 0, 0, R);
      g.addColorStop(0, `rgba(90,190,255,${active ? 0.36 : 0.13})`);
      g.addColorStop(1, 'rgba(90,190,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();

      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, R * 0.9, 0, TAU); ctx.clip();
      const cs = 24;
      for (let iy = -R; iy < R; iy += cs){
        for (let ix = -R; ix < R; ix += cs){
          const on = (((ix / cs) | 0) + ((iy / cs) | 0)) & 1;
          ctx.fillStyle = on
            ? `rgba(105,200,255,${active ? 0.55 : 0.2})`
            : `rgba(16,36,60,${active ? 0.6 : 0.24})`;
          ctx.fillRect(ix, iy, cs, cs);
        }
      }
      ctx.restore();

      ctx.strokeStyle = `rgba(140,215,255,${active ? 0.95 : 0.38})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, R * (0.85 + 0.09 * pulse), 0, TAU); ctx.stroke();

      ctx.fillStyle = `rgba(180,235,255,${active ? 0.9 : 0.35})`;
      ctx.beginPath();
      ctx.moveTo(0, 14); ctx.lineTo(-14, -4); ctx.lineTo(-5, -4);
      ctx.lineTo(-5, -18); ctx.lineTo(5, -18); ctx.lineTo(5, -4); ctx.lineTo(14, -4);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function drawTraffic(){
  for (const it of level.intersections){
    if (Math.abs(it.d - player.d) > 1700) continue;
    for (const car of it.cars){
      const sy = player.d - it.d;
      if (Math.abs(car.x - camera.x) > W / S / 2 + 300) continue;

      ctx.save();
      ctx.translate(car.x, sy);
      ctx.rotate(car.baseVx > 0 ? Math.PI / 2 : -Math.PI / 2);
      drawVehicle(ctx, { kind: car.kind, len: car.len, wid: car.wid, color: car.color });
      ctx.restore();
    }
  }
}

function drawCrossPeds(){
  for (const it of level.intersections){
    if (Math.abs(it.d - player.d) > 1700) continue;
    for (const p of it.peds){
      const t = Math.min(1, p.t);
      const e = t * t * (3 - 2 * t);
      const x = lerp(p.startX, p.endX, e);
      const y = player.d - p.d;
      if (Math.abs(x - camera.x) > W / S / 2 + 100) continue;

      ctx.save();
      ctx.globalAlpha = t < 0.95 ? 1 : (1 - (t - 0.95) * 8);
      ctx.translate(x, y);
      drawPerson(ctx, p.t * 24, p.pal);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawCrowd(V){
  for (const p of level.crowd){
    if (p.d < V.d0 - 100 || p.d > V.d1 + 100) continue;
    const x = roadX(p.d) + p.off;
    const y = player.d - p.d;
    ctx.save();
    ctx.translate(x, y);
    drawPerson(ctx, p.phase + time * Math.abs(p.speed) * 0.32, p.pal);
    ctx.restore();
  }
}

function drawWalkers(){
  for (const w of walkers){
    const t = Math.min(1, w.t / w.dur);
    const e = t * t * (3 - 2 * t);
    const x = lerp(w.x0, w.x1, e);
    const d = lerp(w.d0, w.d1, e);
    const hop = Math.sin(t * Math.PI) * 11;
    ctx.save();
    ctx.globalAlpha = 1 - Math.pow(t, 3);
    ctx.translate(x, player.d - d - hop);
    drawPerson(ctx, w.t * 22, w.pal);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawStopPreview(){
  if (player.speed < 25) return;
  const stopDist = (player.speed * player.speed) / (2 * PHYS.brake);
  const d = player.d + stopDist;
  const x = roadX(d);
  const y = player.d - d;
  let col = 'rgba(255,216,61,0.65)';
  if (zoneIndex < level.stops.length){
    const z = level.stops[zoneIndex];
    if (!z.done && !z.missed && Math.abs(d - z.d) < z.r * 0.8) col = 'rgba(110,255,170,0.9)';
  }
  ctx.save();
  ctx.setLineDash([11, 9]);
  ctx.strokeStyle = col;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(x - level.roadW / 2 + 16, y);
  ctx.lineTo(x + level.roadW / 2 - 16, y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x, 0);
  ctx.rotate(player.angle);
  if (player.invuln > 0 && Math.floor(time * 12) % 2 === 0){
    ctx.globalAlpha = 0.35;
  }
  drawVehicle(ctx, { kind: player.kind, len: 76, wid: 38, color: player.color });
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* =========================================================
   DRAWING — EFFECTS
   ========================================================= */
function drawParticles(){
  for (const p of particles){
    const a = Math.max(0, p.life / p.maxLife);
    const r = p.size * (1 + (1 - a) * (p.grow || 0));
    if (r <= 0.2) continue;
    ctx.globalAlpha = Math.min(1, a * (p.alpha !== undefined ? p.alpha : 1));
    ctx.fillStyle = p.color;
    if (p.type === 'confetti'){
      ctx.save();
      ctx.translate(p.x, player.d - p.d);
      ctx.rotate(p.rot || 0);
      ctx.fillRect(-r/2, -r/2, r, r * 1.7);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, player.d - p.d, r, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloaters(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  for (const f of floaters){
    const t = 1 - f.life / f.maxLife;
    const a = Math.min(1, (f.life / f.maxLife) * 1.9);
    const scale = 1 + t * 0.22;
    ctx.globalAlpha = a;
    ctx.font = `900 ${f.size * scale}px system-ui, "Segoe UI", sans-serif`;
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.strokeText(f.text, f.x, player.d - f.d);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, player.d - f.d);
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   MENU BACKDROP
   ========================================================= */
function drawMenuBackdrop(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#080c15');
  g.addColorStop(0.55, '#101a2c');
  g.addColorStop(1, '#1b2740');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 70; i++){
    const x = hash(i * 13 + 7) * W;
    const y = hash(i * 29 + 3) * H * 0.55;
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.4 + i));
    ctx.globalAlpha = tw * 0.7;
    ctx.fillStyle = '#cfe4ff';
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;

  for (let layer = 0; layer < 3; layer++){
    const speed = 10 + layer * 16;
    const scale = 0.55 + layer * 0.32;
    const baseY = H * 0.70 - layer * 14;
    const seed = layer * 131 + 11;
    const off = (t * speed) % 130;
    for (let i = -2; i < Math.ceil(W / 130) + 3; i++){
      const x = i * 130 - off;
      const h = (80 + hash(seed + i) * 190) * scale;
      const w = 96 * scale;
      ctx.fillStyle = ['#111a2a', '#172136', '#1e2b44'][layer];
      ctx.fillRect(x, baseY - h, w, h + 200);
      ctx.fillStyle = 'rgba(255,214,120,0.22)';
      for (let wy = baseY - h + 10; wy < baseY - 10; wy += 17){
        for (let wx = x + 8; wx < x + w - 8; wx += 15){
          if (hash(i * 37 + wy * 11 + wx) > 0.55) ctx.fillRect(wx, wy, 5, 7);
        }
      }
    }
  }

  const roadY = H * 0.78;
  ctx.fillStyle = '#2b303c';
  ctx.fillRect(0, roadY, W, H - roadY);
  ctx.fillStyle = '#3a4050';
  ctx.fillRect(0, roadY, W, 6);
  ctx.fillStyle = '#ffd23f';
  const dOff = (t * 220) % 110;
  for (let x = -110 + dOff; x < W + 110; x += 110){
    ctx.fillRect(x, roadY + (H - roadY) * 0.55, 54, 5);
  }

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++){
    const p = ((t * 0.35 + i * 0.17) % 1);
    const x = W * (1 - p) * 1.3 - W * 0.15;
    const y = roadY + 26 + (i % 3) * 22;
    const lg = ctx.createLinearGradient(x - 160, y, x + 40, y);
    lg.addColorStop(0, 'rgba(255,210,80,0)');
    lg.addColorStop(1, 'rgba(255,210,80,0.55)');
    ctx.fillStyle = lg;
    ctx.fillRect(x - 160, y, 200, 4);
  }
  ctx.globalCompositeOperation = 'source-over';

  const tx = W * 0.5 + Math.sin(t * 0.9) * 26;
  const ty = roadY + (H - roadY) * 0.46;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.rotate(Math.sin(t * 1.6) * 0.05);
  ctx.scale(1.5, 1.5);
  drawVehicle(ctx, { kind:'taxi', len:76, wid:38, color:'#ffc21a' });
  ctx.restore();

  ctx.globalCompositeOperation = 'lighter';
  const cone = ctx.createRadialGradient(tx, ty - 60, 4, tx, ty - 60, 220);
  cone.addColorStop(0, 'rgba(255,230,150,0.24)');
  cone.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = cone;
  ctx.beginPath();
  ctx.arc(tx, ty - 60, 220, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  const vg = ctx.createRadialGradient(W/2, H*0.5, Math.min(W,H)*0.3,
                                      W/2, H*0.5, Math.max(W,H)*0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (state === 'menu' || state === 'levelselect' || state === 'customize' || !level){
    menuTime += 1 / 60;
    drawMenuBackdrop(menuTime);
    if (fade.a > 0.002){
      ctx.fillStyle = `rgba(4,6,12,${fade.a})`;
      ctx.fillRect(0, 0, W, H);
    }
    return;
  }

  ctx.fillStyle = '#12161f';
  ctx.fillRect(0, 0, W, H);

  const shx = shakeMag > 0.2 ? (Math.random() - 0.5) * shakeMag : 0;
  const shy = shakeMag > 0.2 ? (Math.random() - 0.5) * shakeMag : 0;
  const V = viewRect();

  ctx.save();
  ctx.translate(W / 2 + shx, H * VIEW_Y + shy);
  ctx.scale(S, S);
  ctx.translate(-camera.x, 0);

  drawGround(V);
  drawProps(V);
  drawRoad(V);
  drawBridges(V);
  for (const it of level.intersections){
    if (Math.abs(it.d - player.d) < 1200) drawIntersection(V, it);
  }
  drawObstacles(V);
  drawZones();
  drawCrowd(V);
  drawStopPreview();
  drawTraffic();
  drawCrossPeds();
  drawPlayer();
  drawWalkers();
  drawParticles();
  drawFloaters();

  ctx.restore();

  /* progress bar */
  const p = clamp(player.d / level.length, 0, 1);
  const bw = Math.min(W - 48, 520);
  const bx = (W - bw) / 2, by = H - 26;
  ctx.fillStyle = 'rgba(10,14,22,0.62)';
  rr(ctx, bx, by, bw, 8, 4); ctx.fill();
  const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  pg.addColorStop(0, '#5dff9e');
  pg.addColorStop(1, '#6ec8ff');
  ctx.fillStyle = pg;
  rr(ctx, bx, by, Math.max(8, bw * p), 8, 4); ctx.fill();

  const vg = ctx.createRadialGradient(W/2, H*0.5, Math.min(W,H)*0.32,
                                      W/2, H*0.5, Math.max(W,H)*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (flash > 0.01){
    ctx.fillStyle = `rgba(${flashColor},${flash * 0.32})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (fade.a > 0.002){
    ctx.fillStyle = `rgba(4,6,12,${fade.a})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT = 0;
function loop(t){
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   BOOT
   ========================================================= */
level = null;
state = 'menu';
showOverlay(menuHTML());
updateHUD();
requestAnimationFrame(loop);

})();
</script>
